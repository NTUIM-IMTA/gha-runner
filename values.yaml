# Override values for the gha-runner-scale-set chart
# (oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set)
#
# Pass `githubConfigUrl`, `githubConfigSecret`, and `runnerScaleSetName` on the
# install command. Set `runnerScaleSetName` to `imta-runner-<hostname>`; scale
# set names must be unique in the org's Default runner group. See README
# "Multiple runner hosts".

## Shared label for every cluster's scale set; consumer workflows target it.
scaleSetLabels:
  - imta-runner

## Single-node k3s has limited headroom: each runner pod also brings a
## privileged dind sidecar, so concurrent jobs scale at ~2x the pod count.
## Watch node CPU / memory under load before bumping further.
maxRunners: 8

## dind sidecar — explicit template instead of `containerMode: dind`.
##
## The chart's auto-injected dind sidecar accepts no extra dockerd flags, and
## we need --registry-mirror so the per-job docker daemon pulls Docker Hub
## images (integration/e2e service containers: postgres, redis, …) through the
## in-cluster pull-through cache (dockerhub-mirror/). So this template is a
## verbatim copy of what `helm template` renders for containerMode dind on
## chart 0.15.1 (identical to 0.15.0 and 0.14.2), plus the marked deltas. When bumping the chart version,
## re-render with `containerMode: {type: dind}` and re-diff this block.
template:
  spec:
    initContainers:
      ## [delta] Prepare persistent cache directories once per pod. The image
      ## defines runner (uid 1001; primary group runner) in its upstream base.
      ## Resolve names in-image and chown only these top-level directories so
      ## startup cost stays independent of cache size.
      - name: init-gha-cache
        image: ghcr.io/ntuim-imta/gha-runner:go1.27-node26
        securityContext:
          runAsUser: 0
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            for dir in go-build go-mod golangci-lint pnpm-store pnpm-cache ms-playwright; do
              mkdir -p "/opt/gha-cache/$dir"
              chown runner:runner "/opt/gha-cache/$dir"
            done
        volumeMounts:
          - name: gha-cache
            mountPath: /opt/gha-cache
      - name: init-dind-externals
        image: ghcr.io/ntuim-imta/gha-runner:go1.27-node26
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      ## Native sidecar: an initContainer with restartPolicy Always keeps
      ## running alongside the runner container (same shape the chart renders).
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          ## [delta] Route Docker Hub pulls through the in-cluster pull-through
          ## cache (dockerhub-mirror/). Only docker.io is mirrored — ghcr.io
          ## etc. still go direct — and dockerd falls back to Docker Hub when
          ## the mirror is unreachable. The mirror is plain HTTP inside the
          ## cluster, so it must also be marked insecure.
          - --registry-mirror=http://dockerhub-mirror.dockerhub-mirror.svc.cluster.local:5000
          - --insecure-registry=dockerhub-mirror.dockerhub-mirror.svc.cluster.local:5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command:
              - docker
              - info
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    containers:
      - name: runner
        image: ghcr.io/ntuim-imta/gha-runner:go1.27-node26
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        ## [delta] Run the job container without containerd's default AppArmor
        ## profile. On Ubuntu 26.04 hosts (kernel 7.0, containerd 2.3) that
        ## profile denies signals between processes in the same container, so
        ## `kill` of a job's own child fails with EACCES: vitest cannot stop its
        ## forks workers and tests that send SIGTERM fail. The dind sidecar is
        ## already privileged; jobs here are trusted org workflows.
        securityContext:
          appArmorProfile:
            type: Unconfined
        env:
          ## Route `go mod download` through the in-cluster Athens proxy.
          ## Unlike ACTIONS_RESULTS_URL, GOPROXY is read by the Go toolchain
          ## directly, so Runner.Worker doesn't overwrite it.
          ## Fallback chain: in-cluster → upstream → direct.
          - name: GOPROXY
            value: http://athens.athens.svc.cluster.local:3000,https://proxy.golang.org,direct
          ## Route npm / pnpm / yarn through the in-cluster Verdaccio mirror.
          - name: NPM_CONFIG_REGISTRY
            value: http://verdaccio.verdaccio.svc.cluster.local:4873/
          ## [delta] Route `playwright install` browser downloads through the
          ## in-cluster CDN cache (playwright-cache/). Single host, no
          ## fallback chain — see that manifest's header.
          - name: PLAYWRIGHT_DOWNLOAD_HOST
            value: http://playwright-cache.playwright-cache.svc.cluster.local
          ## [delta] Persistent host cache shared across ephemeral runner pods. See
          ## README's persistent runner caches section for each directory.
          - name: GOCACHE
            value: /opt/gha-cache/go-build
          - name: GOMODCACHE
            value: /opt/gha-cache/go-mod
          - name: GOLANGCI_LINT_CACHE
            value: /opt/gha-cache/golangci-lint
          - name: PNPM_CONFIG_STORE_DIR
            value: /opt/gha-cache/pnpm-store
          - name: PNPM_CONFIG_CACHE_DIR
            value: /opt/gha-cache/pnpm-cache
          - name: PNPM_CONFIG_PREFER_OFFLINE
            value: "true"
          - name: PLAYWRIGHT_BROWSERS_PATH
            value: /opt/gha-cache/ms-playwright
          ## The two below are what containerMode dind used to inject.
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          ## [delta] Persistent cache storage shared across runner pods on this node.
          - name: gha-cache
            mountPath: /opt/gha-cache
        # If the package is private, add an imagePullSecret here.
    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: work
        emptyDir: {}
      ## [delta] Node-local persistent caches for ephemeral runner pods.
      - name: gha-cache
        hostPath:
          path: /var/lib/gha-cache
          type: DirectoryOrCreate
