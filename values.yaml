# Override values for the gha-runner-scale-set chart
# (oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set)
#
# Existing release `my-runners` in namespace `arc-runners` already supplies:
#   githubConfigUrl:    https://github.com/NTUIM-IMTA
#   githubConfigSecret: gh-config
# runnerGroup is left unset, so runners register into the org's Default group.
# Use `--reuse-values -f values.yaml` so those stay intact.

## Single-node k3s has limited headroom: each runner pod also brings a
## privileged dind sidecar, so concurrent jobs scale at ~2x the pod count.
## Watch node CPU / memory under load before bumping further.
maxRunners: 4

## containerMode dind injects a docker:dind sidecar + shared /var/run,
## so `docker/setup-buildx-action` and any plain `docker build` work
## from inside the runner.
containerMode:
  type: dind

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/ntuim-imta/gha-runner:go1.26-node26
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]
        env:
          ## Route `go mod download` through the in-cluster Athens proxy.
          ## Unlike ACTIONS_RESULTS_URL, GOPROXY is read by the Go toolchain
          ## directly, so Runner.Worker doesn't overwrite it.
          ## Fallback chain: in-cluster → upstream → direct.
          - name: GOPROXY
            value: http://athens.athens.svc.cluster.local:3000,https://proxy.golang.org,direct
          ## Route npm / pnpm / yarn through the in-cluster Verdaccio mirror.
          - name: NPM_CONFIG_REGISTRY
            value: http://verdaccio.verdaccio.svc.cluster.local:4873/
        # If the package is private, add an imagePullSecret here.
