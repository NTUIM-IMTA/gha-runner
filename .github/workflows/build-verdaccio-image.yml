name: Build Verdaccio S3 image

on:
  push:
    branches: [main]
    paths:
      - 'verdaccio/Dockerfile'
      - '.github/workflows/build-verdaccio-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-verdaccio-s3-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: verdaccio
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/ntuim-imta/verdaccio-s3:7.x-next
            ghcr.io/ntuim-imta/verdaccio-s3:7.0.0-next-7.30-s3plugin12.1.2
