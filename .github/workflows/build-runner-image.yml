name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - 'go1.27-node26/Dockerfile'
      - '.github/workflows/build-runner-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-image-maintenance
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Read image versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          dockerfile=go1.27-node26/Dockerfile
          go_version=$(sed -n 's/^ARG GO_VERSION=//p' "$dockerfile")
          node_version=$(sed -n 's/^ARG NODE_VERSION=//p' "$dockerfile")
          test -n "$go_version" && test -n "$node_version"
          echo "floating=go${go_version%.*}-node${node_version%%.*}" >> "$GITHUB_OUTPUT"
          echo "immutable=go${go_version}-node${node_version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: go1.27-node26
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ntuim-imta/gha-runner:${{ steps.versions.outputs.floating }}
            ghcr.io/ntuim-imta/gha-runner:${{ steps.versions.outputs.immutable }}
