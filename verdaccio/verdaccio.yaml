# In-cluster npm / pnpm registry mirror (https://verdaccio.org/)
#
# Apply: kubectl apply -f verdaccio/verdaccio.yaml
# Runners use it via NPM_CONFIG_REGISTRY env (set in gha-runner values.yaml).
#
# Package metadata + tarballs live in the in-cluster SeaweedFS S3 store
# (seaweedfs/), NOT on local disk. Verdaccio's local-fs wrote some package.json
# files straight to their final path with no atomic rename, so a crash
# mid-fetch left 0-byte package.json poison-cache files → Verdaccio served them
# and `JSON.parse("")` returned HTTP 500, which made pnpm fail-closed
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) and broke builds. S3 PutObject is
# atomic, so a crash leaves the key absent and Verdaccio re-fetches from npmjs.
#
# The AWS S3 storage plugin is NOT in the stock image — it is baked into a custom
# image (see verdaccio/Dockerfile + BUILD.md). It requires Verdaccio >= 7, which
# currently only ships as a beta (Docker tag 7.x-next). Apply seaweedfs/seaweedfs.yaml
# first; it pre-creates the "verdaccio" bucket (the plugin does not create it).
---
apiVersion: v1
kind: Namespace
metadata:
  name: verdaccio
---
# S3 credentials for the SeaweedFS backend, consumed by the AWS SDK default
# credential chain (the plugin passes no explicit creds, so it reads AWS_* env).
# They MUST match an identity in seaweedfs/seaweedfs.yaml. To rotate: edit there
# and here, re-apply, restart both.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
  namespace: verdaccio
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: gomods
  AWS_SECRET_ACCESS_KEY: gomods-athens-s3-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdaccio-config
  namespace: verdaccio
data:
  config.yaml: |
    # storage is kept only for the htpasswd file / local bits; packages and
    # metadata go to S3 via the store plugin below.
    storage: /verdaccio/storage
    plugins: /verdaccio/plugins
    listen: 0.0.0.0:4873
    web:
      enable: false
    store:
      aws-s3-storage:
        bucket: verdaccio
        region: us-east-1
        endpoint: http://seaweedfs.seaweedfs.svc.cluster.local:8333
        s3ForcePathStyle: true   # required for non-AWS S3 (SeaweedFS)
        dynamoTableName: none    # store the registry index in S3, no DynamoDB
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1   # disable signup
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        cache: true
        timeout: 30s
        maxage: 10m
    packages:
      '@*/*':
        access: $all
        publish: $authenticated
        proxy: npmjs
      '**':
        access: $all
        publish: $authenticated
        proxy: npmjs
    log:
      type: stdout
      format: pretty
      level: warn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdaccio-storage
  namespace: verdaccio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi   # only holds htpasswd now; packages live in S3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: verdaccio
  labels:
    app: verdaccio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verdaccio
  template:
    metadata:
      labels:
        app: verdaccio
    spec:
      # The verdaccio-s3 GHCR package is private; this secret is created once by
      # hand (see README step 5). Harmless if the package is later made public.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: verdaccio
          # Custom image: stock verdaccio:7.x-next (v7 beta) + verdaccio-aws-s3-storage
          # baked in. Build/push per BUILD.md.
          image: ghcr.io/ntuim-imta/verdaccio-s3:7.x-next
          imagePullPolicy: Always
          ports:
            - containerPort: 4873
              name: http
          env:
            ## Override the k8s-injected VERDACCIO_PORT (tcp://<svc-ip>:4873).
            - name: VERDACCIO_PORT
              value: "4873"
          envFrom:
            ## AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the S3 plugin.
            - secretRef:
                name: seaweedfs-credentials
          volumeMounts:
            - name: storage
              mountPath: /verdaccio/storage
            - name: config
              mountPath: /verdaccio/conf
          readinessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: verdaccio-storage
        - name: config
          configMap:
            name: verdaccio-config
---
apiVersion: v1
kind: Service
metadata:
  name: verdaccio
  namespace: verdaccio
spec:
  type: ClusterIP
  selector:
    app: verdaccio
  ports:
    - port: 4873
      targetPort: 4873
      name: http
