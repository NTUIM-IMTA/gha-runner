# In-cluster npm / pnpm registry mirror (https://verdaccio.org/)
#
# Apply: kubectl apply -f verdaccio/verdaccio.yaml
# Runners use it via NPM_CONFIG_REGISTRY env (set in gha-runner values.yaml).
#
# Package metadata + tarballs live in the in-cluster SeaweedFS S3 store
# (seaweedfs/), NOT on local disk. Verdaccio's local-fs wrote some package.json
# files straight to their final path with no atomic rename, so a crash
# mid-fetch left 0-byte package.json poison-cache files → Verdaccio served them
# and `JSON.parse("")` returned HTTP 500, which made pnpm fail-closed
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) and broke builds. S3 PutObject is
# atomic, so a crash leaves the key absent and Verdaccio re-fetches from npmjs.
#
# The AWS S3 storage plugin is NOT in the stock image — it is baked into a custom
# image (see verdaccio/Dockerfile + BUILD.md). It requires Verdaccio >= 7, which
# is currently in beta (the custom image tracks a pinned beta release). Apply
# seaweedfs/seaweedfs.yaml
# first; it pre-creates the "verdaccio" bucket (the plugin does not create it).
# The seed-index initContainer then creates the plugin's package index on an
# empty bucket (see seed-index.mjs in the ConfigMap below).
---
apiVersion: v1
kind: Namespace
metadata:
  name: verdaccio
---
# S3 credentials for the SeaweedFS backend, consumed by the AWS SDK default
# credential chain (the plugin passes no explicit creds, so it reads AWS_* env).
# They MUST match an identity in seaweedfs/seaweedfs.yaml. To rotate: edit there
# and here, re-apply, restart both.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
  namespace: verdaccio
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: gomods
  AWS_SECRET_ACCESS_KEY: gomods-athens-s3-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verdaccio-config
  namespace: verdaccio
data:
  config.yaml: |
    # storage is kept only for the htpasswd file / local bits; packages and
    # metadata go to S3 via the store plugin below.
    storage: /verdaccio/storage
    plugins: /verdaccio/plugins
    listen: 0.0.0.0:4873
    web:
      enable: false
    store:
      aws-s3-storage:
        bucket: verdaccio
        region: us-east-1
        endpoint: http://seaweedfs.seaweedfs.svc.cluster.local:8333
        s3ForcePathStyle: true   # required for non-AWS S3 (SeaweedFS)
        dynamoTableName: none    # store the registry index in S3, no DynamoDB
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1   # disable signup
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        cache: true
        timeout: 30s
        # How long cached metadata is served before Verdaccio revalidates it
        # upstream. Each revalidation re-parses and re-writes the full
        # packument (typescript's is ~16 MB), and with 10m every CI burst
        # revalidated all ~700 packages, pinning the single Node process.
        # Safe while it stays below pnpm's minimumReleaseAge (built-in default
        # 1440 min): any version a lockfile may hold was published more than a
        # day ago, so it is already in a packument cached within 6h.
        maxage: 6h
    packages:
      '@*/*':
        access: $all
        publish: $authenticated
        proxy: npmjs
      '**':
        access: $all
        publish: $authenticated
        proxy: npmjs
    log:
      type: stdout
      format: pretty
      level: warn
  # Run by the seed-index initContainer. On startup the S3 plugin HEADs its
  # package index (verdaccio-s3-db.json) in a detached promise and rethrows
  # NotFound, which kills the process: on an empty bucket Verdaccio crash-loops
  # forever. Create an empty index only when the key is missing — never
  # overwrite, or the existing package list and secret would be lost.
  # The key matches the plugin's LOCAL_STORAGE_KEY with no keyPrefix set above;
  # seaweedfs/cache-gc-cronjob.yaml excludes the same key from eviction.
  seed-index.mjs: |
    import { createRequire } from "node:module";

    const require = createRequire("/verdaccio/plugins/verdaccio-aws-s3-storage/");
    const { S3Client, HeadObjectCommand, PutObjectCommand } = require("@aws-sdk/client-s3");

    const bucket = "verdaccio";
    const key = "verdaccio-s3-db.json";
    const s3 = new S3Client({
      region: "us-east-1",
      endpoint: "http://seaweedfs.seaweedfs.svc.cluster.local:8333",
      forcePathStyle: true,
    });

    function isNotFound(err) {
      return err instanceof Error && (err.name === "NotFound" || err.$metadata?.httpStatusCode === 404);
    }

    try {
      await s3.send(new HeadObjectCommand({ Bucket: bucket, Key: key }));
      console.log(`s3://${bucket}/${key} exists, leaving it untouched`);
    } catch (err) {
      if (!isNotFound(err)) throw err;
      // Same shape as the plugin's in-memory default (secret, list, tokens).
      await s3.send(new PutObjectCommand({
        Bucket: bucket,
        Key: key,
        ContentType: "application/json",
        Body: JSON.stringify({ secret: "", list: [], tokens: [] }),
      }));
      console.log(`created empty s3://${bucket}/${key}`);
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdaccio-storage
  namespace: verdaccio
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi   # only holds htpasswd now; packages live in S3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio
  namespace: verdaccio
  labels:
    app: verdaccio
spec:
  # Verdaccio is one single-threaded Node process. On the EPYC 7402 host
  # (ws4090, 10.1.106.110), one process saturates a core when two CI installs
  # overlap. Metadata and tarballs live in shared S3, so several processes can
  # serve the same data. Concurrent refreshes of one packument are last-writer-
  # wins atomic PutObjects with identical upstream content.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: verdaccio
  template:
    metadata:
      labels:
        app: verdaccio
    spec:
      initContainers:
        ## Seed the plugin's package index on a fresh bucket; see
        ## seed-index.mjs in the ConfigMap. Same image, so the AWS SDK and
        ## credentials match what the plugin uses. The HEAD-then-PUT may race
        ## only while the bucket is empty on first install; at worst two pods
        ## write the same empty index. Once present, every pod leaves it alone.
        - name: seed-index
          image: ghcr.io/ntuim-imta/verdaccio-s3:7.x-next
          imagePullPolicy: Always
          command: ["node", "/verdaccio/conf/seed-index.mjs"]
          envFrom:
            - secretRef:
                name: seaweedfs-credentials
          volumeMounts:
            - name: config
              mountPath: /verdaccio/conf
      containers:
        - name: verdaccio
          # Custom image: stock Verdaccio 7.x + verdaccio-aws-s3-storage
          # baked in. Build/push per BUILD.md.
          image: ghcr.io/ntuim-imta/verdaccio-s3:7.x-next
          imagePullPolicy: Always
          ports:
            - containerPort: 4873
              name: http
          env:
            ## Override the k8s-injected VERDACCIO_PORT (tcp://<svc-ip>:4873).
            - name: VERDACCIO_PORT
              value: "4873"
          envFrom:
            ## AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the S3 plugin.
            - secretRef:
                name: seaweedfs-credentials
          volumeMounts:
            - name: storage
              mountPath: /verdaccio/storage
            - name: config
              mountPath: /verdaccio/conf
          ## A busy Verdaccio answers /-/ping slowly but is still serving. With
          ## the default 1s timeout / 3 failures it was marked unready during
          ## every CI burst, the Service dropped its only endpoint, and pnpm's
          ## metadata requests stalled for 30s+ in retries. Tolerate ~1 min of
          ## slow pings before pulling it.
          readinessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              ## Runner pods have no CPU requests and use 10+ cores each under
              ## load; a full core keeps the single-threaded registry
              ## responsive while the node is saturated.
              cpu: "1"
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: verdaccio-storage
        - name: config
          configMap:
            name: verdaccio-config
---
apiVersion: v1
kind: Service
metadata:
  name: verdaccio
  namespace: verdaccio
spec:
  type: ClusterIP
  selector:
    app: verdaccio
  ports:
    - port: 4873
      targetPort: 4873
      name: http
